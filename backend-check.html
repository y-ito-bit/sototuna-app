<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SOTOTUNA ベータ版</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f7f2;color:#283522;margin:0}main{max-width:620px;margin:auto;padding:24px}section{background:white;padding:22px;margin:16px 0;border-radius:18px}h1,h2{color:#3a7500}h2{font-size:18px}label{display:block;margin:14px 0 6px}input,select,textarea,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;border:1px solid #d7dfcd;border-radius:10px}button{background:#3a7500;color:white;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:default}small{display:block;color:#586552;margin:12px 0;line-height:1.6}[hidden]{display:none!important}.consent{display:flex;gap:10px}.consent input{width:22px;flex:none}#status{white-space:pre-wrap}article{padding:14px 0;border-bottom:1px solid #dde3d8}a{color:#3a7500;overflow-wrap:anywhere}</style></head>
<body><main><a href="/">← アプリへ</a><h1>SOTOTUNA ベータ版</h1><p>架空の連絡先で募集・協力を試せます。本名や実際の連絡先は入力しないでください。</p><p id="status" role="status" aria-live="polite">接続設定を確認しています…</p>
<section id="auth" hidden><h2>テストIDでログイン</h2><small>運営から受け取ったID・パスワードを使います。メール受信は必要ありません。</small>
<form id="betaLogin"><label for="betaId">テストID</label><input id="betaId" required autocomplete="username" placeholder="beta001" pattern="[Bb][Ee][Tt][Aa][0-9]{3,6}"><label for="betaPassword">パスワード</label><input id="betaPassword" type="password" required autocomplete="current-password"><button>ログイン</button></form></section>
<section id="profile" hidden><h2>プロフィール</h2><form id="profileForm"><label for="displayName">よびな</label><input id="displayName" maxlength="10" required><label for="affiliation">所属</label><select id="affiliation"><option value="obog">卒業生</option><option value="current">現役生</option><option value="teacher">教員</option><option value="staff">職員</option></select><button>プロフィールを保存</button></form><button id="logout">ログアウト</button></section>
<section id="newRecruit" hidden><h2>募集を作る</h2><form id="recruitForm"><label for="title">タイトル</label><input id="title" required maxlength="30"><label for="body">内容</label><textarea id="body" required maxlength="200"></textarea><label for="deadline">締切</label><input id="deadline" type="date" required><button>募集を保存</button></form></section>
<section id="recruitList" hidden><h2>募集と協力者</h2><button id="reload">一覧を更新</button><div id="recruitments"></div></section>
<dialog id="apply"><form id="applyForm"><h2>メールでつながって協力する</h2><p id="applyTitle"></p><label for="contactEmail">テスト用メールアドレス</label><input id="contactEmail" type="email" required maxlength="254" readonly><label class="consent"><input type="checkbox" id="consent" required><span>この募集の募集者に、テスト用のよびなと架空のメールアドレスを渡すことに同意します。</span></label><small>架空のアドレスなのでメールは送信されません。募集者とあなたが表示を確認できます。</small><button id="applySubmit">同意して協力する</button><button id="applyClose" type="button">閉じる</button><p id="applyStatus" role="status"></p></form></dialog>
<script type="module" src="/src/backend/check.js"></script></main></body></html>
